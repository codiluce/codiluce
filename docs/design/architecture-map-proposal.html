    #cd-design-map *{box-sizing:border-box}#cd-design-map button{font:inherit;color:inherit}#cd-design-map .cd-head{display:flex;align-items:center;gap:15px;padding:14px 18px;border-bottom:1px solid var(--cd-border);background:var(--cd-panel);flex-wrap:wrap}#cd-design-map .cd-brand{font-size:21px;font-weight:650;letter-spacing:-.6px}#cd-design-map .cd-project{border-left:1px solid var(--cd-border);padding-left:16px}#cd-design-map .cd-sub{font-size:11px;color:var(--cd-muted)}#cd-design-map .cd-nav{display:flex;gap:16px;margin-left:auto;align-items:center;color:var(--cd-muted)}#cd-design-map .cd-nav .cd-current{color:var(--cd-accent);background:var(--cd-accent-soft);padding:5px 10px;border-radius:5px}#cd-design-map .cd-example{font-size:11px;color:var(--cd-muted)}#cd-design-map .cd-toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 17px;border-bottom:1px solid var(--cd-border);background:var(--cd-panel)}#cd-design-map .cd-breadcrumb{color:var(--cd-muted);margin-right:auto}#cd-design-map .cd-segments{display:flex;gap:3px;background:var(--cd-bg);padding:3px;border:1px solid var(--cd-border);border-radius:7px}#cd-design-map .cd-segments button{border:0;background:transparent;padding:5px 11px;border-radius:4px;color:var(--cd-muted)}#cd-design-map .cd-segments button[aria-pressed=true]{background:var(--cd-panel);color:var(--cd-text);box-shadow:0 1px 3px light-dark(#00000014,#00000030)}#cd-design-map .cd-body{display:grid;grid-template-columns:minmax(0,1fr) 264px;align-items:stretch}#cd-design-map .cd-map{min-width:0;position:relative;background-image:repeating-linear-gradient(30deg,transparent,transparent 36px,color-mix(in srgb,var(--cd-border) 30%,transparent) 37px,transparent 38px),repeating-linear-gradient(150deg,transparent,transparent 36px,color-mix(in srgb,var(--cd-border) 30%,transparent) 37px,transparent 38px)}#cd-design-map .cd-map-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 17px 0;position:relative;z-index:1}#cd-design-map .cd-map-head strong{font-weight:600}#cd-design-map .cd-provenance{font-size:11px;color:var(--cd-muted);margin-left:auto}#cd-design-map .cd-scene{position:relative;min-height:510px}#cd-design-map .cd-scene>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}#cd-design-map .cd-zone{stroke:var(--cd-border);stroke-width:1;fill:color-mix(in srgb,var(--zone) 8%,var(--cd-bg))}#cd-design-map .cd-zone-label{fill:var(--cd-muted);font:11px Inter,system-ui,sans-serif;letter-spacing:.05em}#cd-design-map .cd-zones-off .cd-zone{fill:transparent}#cd-design-map .cd-zones-off .cd-zone-label{opacity:.5}#cd-design-map .cd-node{position:absolute;width:140px;padding:0;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;transition:opacity .2s;color:var(--cd-text)}#cd-design-map .cd-node.cd-dim{opacity:.17}#cd-design-map .cd-building{height:78px;width:88px;overflow:visible;display:block;color:var(--node-color)}#cd-design-map .cd-node .cd-roof{fill:color-mix(in srgb,currentColor 22%,var(--cd-building));stroke:color-mix(in srgb,currentColor 50%,var(--cd-border));stroke-width:1}#cd-design-map .cd-node .cd-left{fill:color-mix(in srgb,currentColor 15%,var(--cd-panel));stroke:var(--cd-border);stroke-width:1}#cd-design-map .cd-node .cd-right{fill:color-mix(in srgb,currentColor 32%,var(--cd-building));stroke:var(--cd-border);stroke-width:1}#cd-design-map .cd-node .cd-foot{fill:var(--cd-bg);stroke:var(--cd-border);stroke-width:1}#cd-design-map .cd-node .cd-ring{fill:none;stroke:var(--cd-accent);stroke-width:2;opacity:0}#cd-design-map .cd-node.cd-selected .cd-ring{opacity:1}#cd-design-map .cd-node.cd-bad .cd-ring{opacity:1;stroke:var(--cd-error)}#cd-design-map .cd-roof-glyph{fill:var(--cd-text);font:12px ui-monospace,monospace;text-anchor:middle}#cd-design-map .cd-node-name{font-size:12px;max-width:140px;overflow-wrap:anywhere;font-weight:550;background:var(--cd-bg);border-radius:3px;padding:0 4px}#cd-design-map .cd-role{color:var(--cd-muted);font-size:11px;background:var(--cd-bg);padding:0 4px;border-radius:3px}#cd-design-map .cd-badge{font-size:10px;background:var(--cd-accent-soft);color:var(--cd-accent);border-radius:3px;padding:1px 5px;position:absolute;top:7px;right:12px}#cd-design-map .cd-edge{fill:none;stroke:var(--cd-accent);stroke-width:2}#cd-design-map .cd-edge.cd-candidate{stroke-dasharray:6 4}#cd-design-map .cd-edge.cd-bad{stroke:var(--cd-error);stroke-width:2.4}#cd-design-map .cd-edge-label{font:11px Inter,system-ui,sans-serif;fill:var(--cd-text);paint-order:stroke;stroke:var(--cd-bg);stroke-width:5;stroke-linejoin:round}#cd-design-map .cd-legend{display:flex;gap:13px;flex-wrap:wrap;align-items:center;padding:0 16px 14px;color:var(--cd-muted);font-size:11px}#cd-design-map .cd-swatch{display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--swatch);margin-right:5px}#cd-design-map .cd-inspector{background:var(--cd-panel);border-left:1px solid var(--cd-border);padding:17px;min-width:0}#cd-design-map .cd-inspector-title{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--cd-muted);border-bottom:1px solid var(--cd-border);padding-bottom:13px;margin-bottom:16px}#cd-design-map .cd-inspector h3{font:600 18px/1.3 Inter,system-ui,sans-serif;letter-spacing:-.3px;margin:8px 0 6px;color:var(--cd-text)}#cd-design-map .cd-inspector p{margin:10px 0;font-size:12px}#cd-design-map .cd-inspector h4{font-size:11px;color:var(--cd-muted);text-transform:uppercase;letter-spacing:.06em;font-weight:500;margin:21px 0 10px}#cd-design-map .cd-choice{display:block;width:100%;text-align:left;padding:10px 11px;border:1px solid var(--cd-border);border-radius:6px;background:var(--cd-panel);margin:8px 0}#cd-design-map .cd-choice[aria-pressed=true]{border-color:var(--cd-accent);background:var(--cd-accent-soft)}#cd-design-map .cd-choice small{display:block;font-size:11px;color:var(--cd-muted);margin-top:2px}#cd-design-map .cd-participant{display:flex;align-items:center;justify-content:space-between;gap:6px;border:0;border-bottom:1px solid var(--cd-border);width:100%;background:transparent;padding:8px 0;text-align:left;font-size:12px}#cd-design-map .cd-participant small{font-size:10px;color:var(--cd-muted);white-space:nowrap}#cd-design-map .cd-detail{padding:10px 12px;border-left:2px solid var(--cd-accent);background:var(--cd-bg);border-radius:0 5px 5px 0;margin-top:12px;font-size:12px}#cd-design-map .cd-detail code{font:11px/1.7 ui-monospace,monospace;overflow-wrap:anywhere;color:var(--cd-text);background:transparent;padding:0}#cd-design-map .cd-detail.cd-error{border-left-color:var(--cd-error)}#cd-design-map .cd-status{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:9px 17px;border-top:1px solid var(--cd-border);font-size:11px;color:var(--cd-muted);background:var(--cd-panel)}#cd-design-map .cd-dot{color:var(--cd-accent)}#cd-design-map [hidden]{display:none!important}
    @media(max-width:780px){#cd-design-map .cd-body{grid-template-columns:minmax(0,1fr)}#cd-design-map .cd-inspector{border-left:0;border-top:1px solid var(--cd-border)}#cd-design-map .cd-inspector-content{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:24px}#cd-design-map .cd-inspector-content>.cd-detail{grid-column:1/-1}#cd-design-map .cd-nav{gap:12px}#cd-design-map .cd-head{gap:10px}#cd-design-map .cd-example{width:100%}}
    @media(max-width:430px){#cd-design-map .cd-inspector-content{display:block}#cd-design-map .cd-nav{display:none}#cd-design-map .cd-toolbar{gap:8px}#cd-design-map .cd-breadcrumb{width:100%}#cd-design-map .cd-segments{width:100%;justify-content:space-between}#cd-design-map .cd-segments button{padding:7px 10px}#cd-design-map .cd-map-head{padding-inline:12px}#cd-design-map .cd-provenance{width:100%;margin-left:0}#cd-design-map .cd-head{padding:12px}#cd-design-map .cd-node{width:130px}#cd-design-map .cd-node-name{max-width:130px}}
    @media(prefers-reduced-motion:reduce){#cd-design-map .cd-node{transition:none}}
  </style>
  <div class="cd-head"><span class="cd-brand">codiluce</span><div class="cd-project">checkout-demo<div class="cd-sub">working tree</div></div><div class="cd-nav"><span>Flows</span><span>History</span><span>Impact</span><span class="cd-current">Design</span></div><span class="cd-example">Illustrative data · proposed interface</span></div>
  <div class="cd-toolbar"><div class="cd-breadcrumb">checkout-demo <span aria-hidden="true">›</span> src</div><div class="cd-segments" role="group" aria-label="Design overlay"><button type="button" data-mode="architecture" aria-pressed="true" class="cursor-interaction">Architecture</button><button type="button" data-mode="patterns" aria-pressed="false" class="cursor-interaction">Patterns</button><button type="button" data-mode="rules" aria-pressed="false" class="cursor-interaction">Rules <span class="cd-dot">1</span></button></div></div>
  <div class="cd-body"><div class="cd-map"><div class="cd-map-head"><strong id="cd-map-mode">Architecture roles</strong><span class="cd-provenance" id="cd-map-basis">Declared roles · source dependencies</span></div><div class="cd-scene" id="cd-design-scene" aria-label="Illustrative repository map with selectable files"><svg id="cd-map-lines" aria-hidden="true"></svg><div id="cd-map-buildings"></div></div><div class="cd-legend" id="cd-map-legend"></div></div><aside class="cd-inspector" aria-label="Design inspector"><div class="cd-inspector-title">Inspector · Design</div><div class="cd-inspector-content" id="cd-design-detail" aria-live="polite"></div></aside></div>
  <div class="cd-status"><span><span class="cd-dot">●</span> Files stay in their map positions</span><span id="cd-design-status">Select a building to inspect its architecture role</span></div>
  <script>
    (() => {
      const root = document.getElementById('cd-design-map');
      const scene = root.querySelector('#cd-design-scene'), lines = root.querySelector('#cd-map-lines'), buildings = root.querySelector('#cd-map-buildings'), detail = root.querySelector('#cd-design-detail');
      const files = [
        {id:'order', name:'Order.ts', symbol:'Order', folder:'domain', role:'Domain entity', glyph:'E', h:29, evidence:'Declared role: src/domain/**'},
        {id:'pricing', name:'Pricing.ts', symbol:'Pricing', folder:'domain', role:'Domain service', glyph:'S', h:22, evidence:'Declared role: src/domain/**'},
        {id:'checkout', name:'Checkout.ts', symbol:'Checkout', folder:'application', role:'Use case', glyph:'U', h:36, evidence:'Declared role: src/application/**'},
        {id:'port', name:'PaymentPort.ts', symbol:'PaymentPort', folder:'application', role:'Outbound port', glyph:'P', h:21, evidence:'Declared contract: PaymentPort'},
        {id:'http', name:'CheckoutHttp.ts', symbol:'CheckoutHttp', folder:'adapters', role:'Driving adapter', glyph:'H', h:26, evidence:'Declared role: src/adapters/http/**'},
        {id:'stripe', name:'StripeAdapter.ts', symbol:'StripeAdapter', folder:'adapters', role:'Driven adapter', glyph:'A', h:33, evidence:'Declared role: src/adapters/payment/**'},
        {id:'fake', name:'FakePayment.ts', symbol:'FakePayment', folder:'adapters', role:'Test adapter', glyph:'T', h:18, evidence:'Declared role: src/adapters/testing/**'},
        {id:'bootstrap', name:'bootstrap.ts', symbol:'bootstrap', folder:'bootstrap', role:'Composition root', glyph:'B', h:16, evidence:'Declared wiring exception: src/bootstrap.ts'}
      ];
      const colors={domain:'var(--cd-domain)',application:'var(--cd-app)',adapters:'var(--cd-adapter)',bootstrap:'var(--cd-muted)'};
      const prefs={regions:true, labels:'files'};
      const model={mode:'architecture',pattern:'di',selected:null};
      const members=['checkout','port','stripe','fake'];
      let positions={};
      function savedState(value){const v=value?.modelContent;if(!v)return;if(['architecture','patterns','rules'].includes(v.mode))model.mode=v.mode;if(['di','strategy'].includes(v.pattern))model.pattern=v.pattern;if(files.some(f=>f.id===v.selected))model.selected=v.selected;else model.selected=null;}
      savedState(window.openai?.widgetState);
      function save(){window.openai?.setWidgetState?.({modelContent:{mode:model.mode,pattern:model.pattern,selected:model.selected},privateContent:null})?.catch(()=>{});}
      function polygon(cx,cy,w,h){return `${cx},${cy-h/2} ${cx+w/2},${cy} ${cx},${cy+h/2} ${cx-w/2},${cy}`;}
      function geometry(w){
        if(w<450){return {height:760,zones:[['domain',w*.5,110,w*.93,160],['application',w*.5,345,w*.93,180],['adapters',w*.5,585,w*.96,240]],points:{order:[w*.30,90],pricing:[w*.70,140],checkout:[w*.29,322],port:[w*.70,373],http:[w*.27,534],stripe:[w*.69,582],fake:[w*.34,648],bootstrap:[w*.74,711]}};}
        return {height:535,zones:[['domain',w*.25,120,w*.47,185],['application',w*.73,182,w*.49,185],['adapters',w*.39,365,w*.70,245]],points:{order:[w*.17,100],pricing:[w*.32,158],checkout:[w*.64,156],port:[w*.81,215],http:[w*.17,328],stripe:[w*.39,390],fake:[w*.60,443],bootstrap:[w*.85,453]}};
      }
      function nodePosition(id){return positions[id]||[0,0];}
      function edge(from,to,label,options={}){
        const [x1,y1]=nodePosition(from),[x2,y2]=nodePosition(to);const a=y1-35,b=y2-35;
        const mx=(x1+x2)/2,my=(a+b)/2-(options.arc||18),path=`M${x1} ${a} Q${mx} ${my-35} ${x2} ${b}`;
        return `<path d="${path}" class="cd-edge${options.bad?' cd-bad':''}${options.candidate?' cd-candidate':''}" marker-end="url(#cd-edge-${options.bad?'bad':'normal'})"/>${label?`<text x="${mx}" y="${my-15}" text-anchor="middle" class="cd-edge-label">${label}</text>`:''}`;
      }
      function buildingSvg(file){const h=file.h;return `<svg class="cd-building" viewBox="0 0 88 78" aria-hidden="true"><polygon class="cd-ring" points="44,29 86,50 44,73 2,50"/><polygon class="cd-foot" points="44,29 82,49 44,69 6,49"/><polygon class="cd-left" points="8,${47-h} 44,${65-h} 44,65 8,47"/><polygon class="cd-right" points="44,${65-h} 80,${47-h} 80,47 44,65"/><polygon class="cd-roof" points="44,${29-h} 80,${47-h} 44,${65-h} 8,${47-h}"/><text x="44" y="${51-h}" class="cd-roof-glyph">${file.glyph}</text></svg>`;}
      function participants(ids){return ids.map(id=>{const f=files.find(f=>f.id===id);const role=model.mode==='patterns'?(id==='checkout'?'consumer':id==='port'?'contract':id==='bootstrap'?'wiring':model.pattern==='di'?'provider':'alternative'):f.role.toLowerCase();return `<button class="cd-participant cursor-interaction" type="button" data-select="${id}" aria-label="Inspect ${f.symbol}"><span>${f.symbol}</span><small>${role}</small></button>`;}).join('');}
      function renderDetail(){
        const selected=files.find(f=>f.id===model.selected);
        if(model.mode==='architecture'){
          detail.innerHTML=`<div><span class="cd-sub">ARCHITECTURE PROFILE</span><h3>Ports &amp; adapters</h3><p>Roles come from your architecture declaration.</p><h4>Dependency policy</h4><p>Application and domain code depend on owned contracts. Adapters supply implementations.</p></div><div><h4>${selected?'Selected file':'Architecture roles'}</h4>${selected?`<h3>${selected.symbol}</h3><p>${selected.role}</p><div class="cd-detail"><code>${selected.evidence}</code></div>`:participants(['order','checkout','port','stripe'])}</div><div class="cd-detail">${selected?'Role assignment describes intent. Rules check the dependencies.':'Select a file to see its assigned role. Map positions and building types stay unchanged.'}</div>`;
        }else if(model.mode==='patterns'){
          const di=model.pattern==='di';
          detail.innerHTML=`<div><span class="cd-sub">PATTERNS IN THIS AREA</span><button type="button" class="cd-choice cursor-interaction" data-pattern="di" aria-pressed="${di}">Dependency injection<small>Explicit wiring · source evidence</small></button><button type="button" class="cd-choice cursor-interaction" data-pattern="strategy" aria-pressed="${!di}">Payment strategy<small>Structural candidate · review intent</small></button><h4>${di?'Binding graph':'Pattern roles'}</h4><p>${di?'The composition root binds PaymentPort to StripeAdapter. FakePayment is a test alternative.':'Checkout delegates to PaymentPort. StripeAdapter and FakePayment offer interchangeable implementations.'}</p></div><div><h4>Participants</h4>${participants(di?[...members,'bootstrap']:members)}</div><div class="cd-detail"><code>${di?'bootstrap.ts:18 — binds PaymentPort → StripeAdapter':'Checkout.ts:24 — invokes PaymentPort.pay()'}</code><p>${selected?'Selected: '+selected.symbol+'. ':''}${di?'Registration and injection are not runtime calls.':'Same structure may also be described as a port with adapters; the pattern label needs confirmation.'}</p></div>`;
        }else{
          detail.innerHTML=`<div><span class="cd-sub">DEPENDENCY RULE</span><h3>Application imports an adapter</h3><p>Checkout depends directly on StripeAdapter instead of its owned port.</p><h4>Rule</h4><p>Application → infrastructure is forbidden.</p></div><div><h4>Witness</h4>${participants(['checkout','stripe'])}<h4>Related principle</h4><p>Dependency Inversion</p></div><div class="cd-detail cd-error"><code>Checkout.ts:7<br>import { StripeAdapter }<br>from '../adapters/StripeAdapter'</code><p>Source-backed violation of a declared rule. Other unresolved dependencies remain separate.</p></div>`;
        }
      }
      function render(){
        const w=Math.max(280,scene.getBoundingClientRect().width),g=geometry(w);positions=g.points;scene.style.height=g.height+'px';scene.classList.toggle('cd-zones-off',!prefs.regions);
        lines.setAttribute('viewBox',`0 0 ${w} ${g.height}`);
        const zoneMarkup=g.zones.map(([name,x,y,width,height])=>`<g style="--zone:${colors[name]}"><polygon points="${polygon(x,y,width,height)}" class="cd-zone"/><text class="cd-zone-label" x="${x}" y="${y-height/2-12}" text-anchor="middle">${name.toUpperCase()}</text></g>`).join('');
        let edges='';
        if(model.mode==='patterns'){
          const candidate=model.pattern==='strategy';
          edges=edge('checkout','port',candidate?'delegates':'requires',{candidate})+edge('stripe','port','implements',{candidate})+edge('fake','port','implements',{candidate});
          if(!candidate)edges+=edge('bootstrap','stripe','binds',{arc:-25});
        }else if(model.mode==='rules'){edges=edge('checkout','stripe','forbidden import',{bad:true,arc:45});}
        lines.innerHTML=`<defs><marker id="cd-edge-normal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--cd-accent)"/></marker><marker id="cd-edge-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--cd-error)"/></marker></defs>${zoneMarkup}${edges}`;
        const relevant=model.mode==='patterns'?new Set(model.pattern==='di'?[...members,'bootstrap']:members):model.mode==='rules'?new Set(['checkout','stripe']):null;
        buildings.innerHTML=files.map(f=>{const [x,y]=g.points[f.id],width=w<431?130:140;const dim=relevant&&!relevant.has(f.id);return `<button type="button" class="cd-node cursor-interaction${dim?' cd-dim':''}${relevant?.has(f.id)||model.selected===f.id?' cd-selected':''}${model.mode==='rules'&&relevant?.has(f.id)?' cd-bad':''}" data-select="${f.id}" style="left:${x-width/2}px;top:${y-78}px;--node-color:${colors[f.folder]}" aria-label="${f.name}, ${f.role}">${buildingSvg(f)}<span class="cd-node-name">${prefs.labels==='symbols'?f.symbol:f.name}</span><span class="cd-role">${model.mode==='patterns'&&members.includes(f.id)?f.id==='checkout'?'consumer':f.id==='port'?'contract':model.pattern==='di'?'provider':'alternative':f.role}</span>${model.mode==='patterns'&&members.includes(f.id)?'<span class="cd-badge">2 patterns</span>':''}</button>`;}).join('');
        root.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===model.mode)));
        root.querySelector('#cd-map-mode').textContent=model.mode==='architecture'?'Architecture roles':model.mode==='patterns'?(model.pattern==='di'?'Dependency injection':'Payment strategy'):'Forbidden dependency';
        root.querySelector('#cd-map-basis').textContent=model.mode==='architecture'?'Declared roles · source dependencies':model.mode==='patterns'?(model.pattern==='di'?'Explicit registration · source dependencies':'Candidate membership · supporting source links'):'Declared policy · source-backed witness';
        root.querySelector('#cd-map-legend').innerHTML=model.mode==='architecture'?`<span><i class="cd-swatch" style="--swatch:var(--cd-domain)"></i>Domain</span><span><i class="cd-swatch" style="--swatch:var(--cd-app)"></i>Application</span><span><i class="cd-swatch" style="--swatch:var(--cd-adapter)"></i>Adapters</span><span>Roles declared by user</span>`:model.mode==='patterns'?`<span><i class="cd-swatch" style="--swatch:var(--cd-accent)"></i>Selected participants</span><span>${model.pattern==='di'?'Solid links: declared wiring and contracts':'Dashed overlay: candidate pattern membership'}</span>`:`<span><i class="cd-swatch" style="--swatch:var(--cd-error)"></i>Forbidden import</span><span>Unrelated code fades</span>`;
        root.querySelector('#cd-design-status').textContent=model.mode==='architecture'?'Select a building to inspect its architecture role':model.mode==='patterns'?'Select a pattern or participant in the Inspector':'Select either file to inspect the rule witness';
        renderDetail();
      }
      root.addEventListener('click',e=>{const button=e.target.closest('button');if(!button||!root.contains(button))return;if(button.dataset.mode){model.mode=button.dataset.mode;model.selected=null;}else if(button.dataset.pattern){model.pattern=button.dataset.pattern;model.selected=null;}else if(button.dataset.select){model.selected=button.dataset.select;}else return;render();save();});
      window.addEventListener('openai:set_globals',event=>{if(event.detail?.globals?.widgetState){savedState(event.detail.globals.widgetState);render();}});
      new ResizeObserver(render).observe(scene);render();
      if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addToggle(prefs,'regions',{label:'Architecture district tint'});tweak.addSelect(prefs,'labels',{label:'Map label detail',options:[{label:'Files',value:'files'},{label:'Symbols',value:'symbols'}]});}
    })();
  </script>
</div>
